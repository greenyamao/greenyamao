<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <!-- Night atmosphere blur filters -->
    <filter id="clouds-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="55" />
    </filter>
    <filter id="clouds-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" />
    </filter>

    <style>
      /* Distant storm sheet lightning (subtle horizon pulses) */
      @keyframes storm-flash-1 {
        0%, 86%, 93%, 100% { opacity: 0; }
        87.5% { opacity: 0.28; }
        89%   { opacity: 0.10; }
        90.5% { opacity: 0.38; }
      }

      @keyframes storm-flash-2 {
        0%, 72%, 79%, 100% { opacity: 0; }
        73.5% { opacity: 0.18; }
        75%   { opacity: 0.07; }
        76.5% { opacity: 0.26; }
      }

      /* Slow atmospheric cloud drifting */
      @keyframes drift-a {
        0%, 100% { transform: translate(0px, 0px); }
        50%      { transform: translate(25px, -8px); }
      }

      @keyframes drift-b {
        0%, 100% { transform: translate(0px, 0px); }
        50%      { transform: translate(-22px, 12px); }
      }

      /* Radar ping */
      @keyframes ping {
        0%   { r: 3.5px; opacity: 0.85; }
        50%  { r: 8px;   opacity: 0; }
        100% { r: 3.5px; opacity: 0.85; }
      }

      .storm-1 { animation: storm-flash-1 12s infinite ease-in-out; }
      .storm-2 { animation: storm-flash-2 17s infinite ease-in-out 4s; }
      .drift-1 { animation: drift-a 30s infinite ease-in-out; }
      .drift-2 { animation: drift-b 36s infinite ease-in-out; }
      .radar-ring { animation: ping 3s infinite cubic-bezier(0.2, 0.6, 0.3, 1); }

      .mono {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Deep near-black background -->
  <rect width="900" height="360" rx="12" fill="#08090d" />

  <!-- ATMOSPHERE LAYER (Night clouds) -->
  <g class="drift-1" filter="url(#clouds-heavy)">
    <circle cx="180" cy="90"  r="170" fill="#0f1624" />
    <circle cx="520" cy="70"  r="190" fill="#121b2c" />
    <circle cx="780" cy="180" r="160" fill="#0c1320" />
    <circle cx="340" cy="270" r="140" fill="#090e18" />
  </g>

  <g class="drift-2" filter="url(#clouds-soft)">
    <circle cx="100" cy="200" r="85" fill="#152033" opacity="0.6" />
    <circle cx="440" cy="120" r="95" fill="#18243b" opacity="0.5" />
    <circle cx="680" cy="80"  r="75" fill="#172236" opacity="0.55" />
    <circle cx="820" cy="290" r="85" fill="#0f1727" opacity="0.7" />
  </g>

  <!-- DISTANT SHEET LIGHTNING FLASHES -->
  <g class="storm-1" filter="url(#clouds-heavy)">
    <circle cx="310" cy="70" r="200" fill="#648dc8" />
    <ellipse cx="400" cy="95" rx="140" ry="85" fill="#8cb2ea" />
  </g>
  <g class="storm-2" filter="url(#clouds-heavy)">
    <circle cx="720" cy="110" r="170" fill="#5072a3" />
    <ellipse cx="680" cy="85"  rx="120" ry="70" fill="#7fa2d6" />
  </g>

  <!-- Outer subtle border -->
  <rect width="898" height="358" x="1" y="1" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- ================= FOREGROUND TEXT CONTENT ================= -->

  <!-- Top bar -->
  <text class="mono" x="48" y="46" font-size="11" fill="#64748b" letter-spacing="1.5">SYSTEM // PROFILE_MANIFEST</text>

  <!-- Radar ping indicator -->
  <g transform="translate(755, 42)">
    <circle cx="0" cy="0" r="3.5" class="radar-ring" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#3b82f6" />
    <text class="mono" x="14" y="3.5" font-size="11" fill="#94a3b8">online</text>
  </g>

  <!-- Headline -->
  <text class="sans" x="48" y="106" font-size="25" font-weight="600" fill="#f8fafc" letter-spacing="-0.3">Software &amp; Web Systems Engineer</text>
  <text class="mono" x="48" y="132" font-size="12.5" fill="#94a3b8">building modern web interfaces, declarative workflows &amp; automated pipelines</text>

  <!-- Separator rule -->
  <line x1="48" y1="164" x2="852" y2="164" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Column 1: Core Technologies -->
  <text class="mono" x="48" y="202" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1.2">LANGUAGES &amp; RUNTIMES</text>
  <text class="sans" x="48" y="226" font-size="13.5" font-weight="500" fill="#e2e8f0">TypeScript <tspan fill="#475569">·</tspan> JavaScript (ESNext) <tspan fill="#475569">·</tspan> Node.js</text>
  <text class="mono" x="48" y="248" font-size="11" fill="#8494ab">Async flows, reactive state, clean abstractions</text>

  <!-- Column 2: DevOps & Automation -->
  <text class="mono" x="380" y="202" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1.2">DEVOPS &amp; DELIVERY</text>
  <text class="sans" x="380" y="226" font-size="13.5" font-weight="500" fill="#e2e8f0">CI/CD Pipelines <tspan fill="#475569">·</tspan> Docker <tspan fill="#475569">·</tspan> GitHub Actions</text>
  <text class="mono" x="380" y="248" font-size="11" fill="#8494ab">Automated testing, reproducible container builds</text>

  <!-- Column 3: Academic Foundation -->
  <text class="mono" x="650" y="202" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1.2">FOUNDATION</text>
  <text class="sans" x="650" y="226" font-size="13.5" font-weight="500" fill="#e2e8f0">Degree in Info Systems</text>
  <text class="mono" x="650" y="248" font-size="11" fill="#8494ab">Software &amp; Systems Architecture</text>

  <!-- Bottom status line -->
  <text class="mono" x="48" y="306" font-size="11.5" fill="#4f5e77"><tspan fill="#38bdf8">~</tspan> status: <tspan fill="#cbd5e1">shipping zero-bloat repositories &amp; automated pipelines</tspan></text>
</svg>
