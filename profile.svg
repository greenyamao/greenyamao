<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <filter id="clouds-deep" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="140" />
    </filter>
    <filter id="clouds-diffuse" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="95" />
    </filter>

    <style>
      /* Distant storm sheet lightning (deep, moody pulses) */
      @keyframes storm-flash-1 {
        0%, 86%, 93%, 100% { opacity: 0; }
        87.5% { opacity: 0.18; }
        89%   { opacity: 0.05; }
        90.5% { opacity: 0.25; }
      }

      @keyframes storm-flash-2 {
        0%, 72%, 79%, 100% { opacity: 0; }
        73.5% { opacity: 0.12; }
        75%   { opacity: 0.03; }
        76.5% { opacity: 0.18; }
      }

      /* Slow drifting cloud mass */
      @keyframes drift-a {
        0%, 100% { transform: translate(0px, 0px); }
        50%      { transform: translate(30px, -10px); }
      }

      @keyframes drift-b {
        0%, 100% { transform: translate(0px, 0px); }
        50%      { transform: translate(-25px, 14px); }
      }

      /* Pulse radar */
      @keyframes ping {
        0%   { r: 3.5px; opacity: 0.85; }
        50%  { r: 8px;   opacity: 0; }
        100% { r: 3.5px; opacity: 0.85; }
      }

      .storm-1 { animation: storm-flash-1 14s infinite ease-in-out; }
      .storm-2 { animation: storm-flash-2 19s infinite ease-in-out 5s; }
      .drift-1 { animation: drift-a 32s infinite ease-in-out; }
      .drift-2 { animation: drift-b 40s infinite ease-in-out; }
      .radar-ring { animation: ping 3s infinite cubic-bezier(0.2, 0.6, 0.3, 1); }

      .mono {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <rect width="900" height="360" rx="12" fill="#010204" />

  <g class="drift-1" filter="url(#clouds-deep)">
    <circle cx="200" cy="110" r="180" fill="#030509" />
    <circle cx="560" cy="80"  r="210" fill="#05080e" />
    <circle cx="790" cy="200" r="170" fill="#020306" />
    <circle cx="340" cy="280" r="150" fill="#010204" />
  </g>

  <g class="drift-2" filter="url(#clouds-diffuse)">
    <circle cx="120" cy="190" r="110" fill="#060912" opacity="0.4" />
    <circle cx="460" cy="130" r="120" fill="#080c18" opacity="0.3" />
    <circle cx="690" cy="90"  r="100" fill="#050810" opacity="0.4" />
    <circle cx="830" cy="280" r="110" fill="#030508" opacity="0.5" />
  </g>

  <g class="storm-1" filter="url(#clouds-deep)">
    <circle cx="330" cy="80" r="220" fill="#14243b" />
    <ellipse cx="420" cy="105" rx="160" ry="95" fill="#1d304f" />
  </g>
  <g class="storm-2" filter="url(#clouds-deep)">
    <circle cx="730" cy="110" r="190" fill="#0e182b" />
    <ellipse cx="690" cy="90"  rx="130" ry="75" fill="#15243d" />
  </g>

  <rect width="898" height="358" x="1" y="1" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <text class="mono" x="48" y="48" font-size="12" font-weight="600" fill="#64748b" letter-spacing="2">PROFILE</text>

  <g transform="translate(755, 44)">
    <circle cx="0" cy="0" r="3.5" class="radar-ring" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#0284c7" />
    <text class="mono" x="14" y="3.5" font-size="12" fill="#64748b">online</text>
  </g>

  <text class="sans" x="48" y="115" font-size="32" font-weight="600" fill="#ffffff" letter-spacing="-0.5">Software &amp; Web Systems Engineer</text>
  
  <text class="mono" x="48" y="145" font-size="14" fill="#94a3b8">Web Interfaces · Declarative Workflows · Automated Pipelines</text>

  <line x1="48" y1="180" x2="852" y2="180" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

  <text class="mono" x="48" y="230" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.5">LANGUAGES</text>
  <text class="sans" x="48" y="260" font-size="16" font-weight="500" fill="#ffffff">TypeScript <tspan fill="#475569">·</tspan> JavaScript <tspan fill="#475569">·</tspan> Node.js</text>

  <text class="mono" x="380" y="230" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.5">DEVOPS</text>
  <text class="sans" x="380" y="260" font-size="16" font-weight="500" fill="#ffffff">CI/CD <tspan fill="#475569">·</tspan> Docker <tspan fill="#475569">·</tspan> GitHub Actions</text>

  <text class="mono" x="650" y="230" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.5">FOUNDATION</text>
  <text class="sans" x="650" y="260" font-size="16" font-weight="500" fill="#ffffff">Info Systems Degree</text>

  <text class="mono" x="48" y="320" font-size="13" fill="#64748b"><tspan fill="#38bdf8">~</tspan> status: <tspan fill="#e2e8f0">building robust systems</tspan></text>
</svg>
